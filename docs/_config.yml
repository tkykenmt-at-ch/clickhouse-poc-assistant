# GitHub Pages (built from /docs on main).
title: PoC Assistant
description: A ClickHouse Agents agent that helps run a ClickHouse Cloud proof of concept, with evidence and sources.
theme: jekyll-theme-primer
plugins:
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-relative-links
relative_links:
  enabled: true
exclude:
  - "*.sh"
